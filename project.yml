name: Portico

options:
  defaultConfig: Release

settings:
  base:
    CLANG_ENABLE_MODULES: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SWIFT_VERSION: "5.0"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  PorticoApplication:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Portico

  Portico:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PorticoLauncher
    dependencies:
      - target: PorticoApplication
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSUIElement: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 1
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisbanes.Portico
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: "YES"
          PRODUCT_BUNDLE_IDENTIFIER: dev.chrisbanes.Portico.Debug
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    postBuildScripts:
      - name: Build and Embed Helper
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/portico-helper"
        script: |
          set -euo pipefail
          helper_output="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/portico-helper"
          PORTICO_GO_BUILD_CACHE="${DERIVED_FILE_DIR}/go-build-cache" PORTICO_GO_MOD_CACHE="${SRCROOT}/helper/.build/go-mod-cache" ARCHS="${ARCHS}" CURRENT_ARCH="${CURRENT_ARCH}" "${SRCROOT}/Scripts/build-helper.sh" "${helper_output}"

  PorticoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PorticoTests
    dependencies:
      - target: PorticoApplication
    settings:
      base:
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisbanes.PorticoTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"

  PorticoUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PorticoUITests
    dependencies:
      - target: Portico
    settings:
      base:
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: dev.chrisbanes.PorticoUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Portico

schemes:
  Portico:
    build:
      targets:
        Portico: all
        PorticoTests: [test]
    test:
      config: Debug
      targets:
        - PorticoTests

  Portico UI Tests:
    build:
      targets:
        Portico: all
        PorticoUITests: [test]
    test:
      config: Debug
      targets:
        - PorticoUITests
