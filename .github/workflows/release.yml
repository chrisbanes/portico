name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public 0.x.y version to publish (for example, 0.1.0)
        required: true
        type: string
      source_commit:
        description: Full 40-character commit ID to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build and publish release DMG
    runs-on: macos-26
    timeout-minutes: 90
    environment: public-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_commit }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install XcodeGen with Homebrew
        run: brew install xcodegen

      - name: Run prerequisite Swift and Go suites
        run: |
          set -euo pipefail
          bundle exec fastlane mac test
          (cd helper && go test ./...)

      - name: Test release contract
        run: python3 Scripts/test-release.py

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
        with:
          keychain: portico-release
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

      - name: Run release process
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bundle exec fastlane mac release version:"$VERSION" source_commit:"$SOURCE_COMMIT"
