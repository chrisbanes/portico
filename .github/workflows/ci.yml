name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test release contract
        run: python3 Scripts/test-release.py

      - name: Setup Go 1.26.5 for embedded helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install XcodeGen with Homebrew
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Run Swift unit and native UI suites
        run: bundle exec fastlane mac test

  go:
    name: Go
    runs-on: macos-26
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: helper/go.sum

      - name: Build Go helper
        run: go build ./cmd/portico-helper

      - name: Test Go helper
        run: go test ./...
