name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Test public preview release contract
        run: python3 Scripts/test-preview-release.py

      - name: Setup Go 1.26.5 for embedded helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install XcodeGen with Homebrew
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: ./Scripts/generate-xcode-project.sh

      - name: Test headless Swift unit suite
        run: >
          xcodebuild -project Portico.xcodeproj -scheme Portico
          -destination 'platform=macOS' -derivedDataPath .build/xcode-unit test

      - name: Test native Swift UI suite
        run: >
          xcodebuild -project Portico.xcodeproj -scheme 'Portico UI Tests'
          -destination 'platform=macOS' -derivedDataPath .build/xcode-ui test

  go:
    name: Go
    runs-on: macos-26
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: helper/go.sum

      - name: Build Go helper
        run: go build ./cmd/portico-helper

      - name: Test Go helper
        run: go test ./...
