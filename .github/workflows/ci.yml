name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test release contract
        run: python3 Scripts/test-release.py

      - name: Setup Go 1.26.5 for embedded helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install XcodeGen with Homebrew
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Verify Xcode project generation
        run: ./Scripts/verify-xcode-project-generation.sh

      - name: Run Swift unit and native UI suites
        run: bundle exec fastlane mac test

  go-matrix:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            packages: ./...
          # cmd/portico-helper is darwin-only.
          - os: ubuntu-24.04
            packages: ./internal/... ./cmd/portico-service
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: helper/go.sum

      - name: Build Go helper
        if: runner.os == 'macOS'
        run: go build ./cmd/portico-helper

      - name: Build Go service
        run: |
          go build -o "$RUNNER_TEMP/portico-service" ./cmd/portico-service
          go build -tags porticofake -o "$RUNNER_TEMP/portico-service-fake" ./cmd/portico-service

      - name: Test Go helper
        run: go test -race ${{ matrix.packages }}

      # Runs the IPC probe as nobody and as root, and fails if it was skipped.
      - name: Test IPC peer rejection across users
        shell: bash
        env:
          PORTICO_IPC_CROSS_USER: '1'
        run: |
          go test -race -count=1 -v -run '^TestCrossUser' ./internal/ipc/ | tee "$RUNNER_TEMP/cross-user.log"
          grep -q -- '--- PASS: TestCrossUserPeersAreRejected' "$RUNNER_TEMP/cross-user.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/cross-user.log"; then exit 1; fi

  # Runs the porticofake service under launchd and systemd --user. A separate
  # bounded proof of hosted-runner service managers, so not part of "Go".
  service-lifecycle:
    name: Service lifecycle ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: helper/go.sum

      # CI only: lingering gives the headless runner a user manager. The
      # service itself never enables lingering.
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          # systemctl --user reaches the manager over its private socket, or
          # the user bus where dbus-user-session provides one.
          timeout 60 bash -c "until [ -S '$runtime_dir/systemd/private' ] || [ -S '$runtime_dir/bus' ]; do sleep 1; done"
          XDG_RUNTIME_DIR="$runtime_dir" systemctl --user is-system-running --wait || true

      - name: Run the service lifecycle check
        run: Scripts/test-service-lifecycle.sh

  # Compiles every released reader and HEAD's, and proves the MIG-1 guard
  # excludes each. Not part of "Go": it is the guard's own proof.
  legacy-guard:
    name: Legacy guard
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # The v* tags name the released readers.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache-dependency-path: helper/go.sum

      - name: Verify the legacy-writer guard
        run: Scripts/verify-legacy-guard.sh

  # The required "Go" check: passes only when every matrix leg passes.
  go:
    name: Go
    needs: go-matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.go-matrix.result }}" = success
